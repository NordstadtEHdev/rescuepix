<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>rescuepix Admin Control Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body style="padding: 40px 8%;">

    <div class="card-container" style="max-width: 800px;">
        <h2>rescuep<span class="beacon-i">i</span>x Admin Panel</h2>
        <p class="subtitle" style="color:#00e676;">✓ IP-Sperre aktiv. Zugriff gewährt.</p>
        
        <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

        <h3>Neues Blaulicht-Foto hochladen</h3>
        
        <button id="upload_widget" class="btn btn-primary" style="margin: 20px 0;">
            Bild auswählen & hochladen
        </button>

        <div id="output" style="display:none; text-align:left; background:#080b10; padding:20px; border-radius:10px; margin-top:20px;">
            <p><strong>Code für deine index.html:</strong></p>
            <small style="color:#94a3b8;">Kopiere diesen Block ganz nach OBEN in deine Galerie-Grid, damit es als neuestes Bild erscheint:</small>
            <textarea id="codeOutput" rows="6" style="width:100%; margin-top:10px; background:#161b22; color:#00a2ff; border:none; padding:10px; font-family:monospace;"></textarea>
        </div>
    </div>

    <script type="text/javascript">
        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'demo', // Hier deinen eigenen Cloudinary Namen eintragen
            uploadPreset: 'unsigned_preset'
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                var imageUrl = result.info.secure_url;
                var htmlCode = `<div class="gallery-item feuerwehr">\n  <img src="${imageUrl}" alt="BOS Bild">\n  <div class="overlay">\n    <span class="tag">FEUERWEHR</span>\n    <h3>Neues Einsatzfoto</h3>\n  </div>\n</div>`;
                
                document.getElementById('codeOutput').value = htmlCode;
                document.getElementById('output').style.display = 'block';
            }
        });

        document.getElementById("upload_widget").addEventListener("click", function(){
            myWidget.open();
        }, false);
    </script>
</body>
</html>
